# Services definition for devcontainer

name: python-devbox

services:

  devcontainer:
    # Build
    image: ghcr.io/matiboux/devbox-python-docker:3.14-uv
    # Deploy
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      COMPOSE_IGNORE_ORPHANS: 'true'
      DOCKER_HOST: tcp://dind:2375
    working_dir: /workdir
    command: sleep infinity
    volumes:
      - ..:/workdir
    depends_on:
      - dind

  # Docker-in-Docker sidecar, providing an isolated Docker daemon
  # to the devcontainer service over DOCKER_HOST (no host socket access).
  dind:
    image: docker:dind
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ''
    command:
      - --host=tcp://0.0.0.0:2375
    volumes:
      - dind-storage:/var/lib/docker

volumes:
  dind-storage:
