# Services definition for devcontainer

name: python-devbox

services:

  devcontainer:
    # Build
    image: ghcr.io/matiboux/devbox-python-docker:3.13-uv0.10
    # Deploy
    extra_hosts:
      - host.docker.internal:host-gateway
    working_dir: /workdir
    command: sleep infinity
    volumes:
      - ..:/workdir
      - /var/run/docker.sock:/var/run/docker.sock
