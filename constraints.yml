# Configuration of version constraints, used for build matrix generation.

python:
  # Minimum Python version to support
  min_version: "3.10"
  # Additional legacy Python versions to include
  extra_versions: ["3.9"]
  # Specific Python versions to skip
  skip_versions: []

poetry:
  # Minimum Poetry version to support
  min_version: "2.1"
  # Additional legacy Poetry versions to include
  extra_versions: ["1.8"]
  # Specific Poetry versions to skip
  skip_versions: []

uv:
  # Minimum uv version to support
  min_version: "0.8"
  # Additional legacy uv versions to include
  extra_versions: []
  # Specific uv versions to skip
  skip_versions: []

node:
  # Minimum nvm version to support
  min_version: "26"
  # Additional legacy nvm versions to include
  extra_versions: ["20", "22", "24"]
  # Specific nvm versions to skip
  skip_versions: []

nvm:
  # Minimum nvm version to support
  min_version: "0.40"
  # Additional legacy nvm versions to include
  extra_versions: []
  # Specific nvm versions to skip
  skip_versions: []

yarn:
  # Minimum yarn version to support
  min_version: "4"
  # Additional legacy yarn versions to include
  extra_versions: []
  # Specific yarn versions to skip
  skip_versions: []

pnpm:
  # Minimum pnpm version to support
  min_version: "10"
  # Additional legacy pnpm versions to include
  extra_versions: []
  # Specific pnpm versions to skip
  skip_versions: []

# Cross-package version compatibility constraints.
# Each rule specifies conditions ('when') that trigger a skip ('skip').
# A combination is skipped when ALL 'when' package constraints are met
# AND ANY 'skip' package constraint is met.
skip_combinations:
  # Poetry 2.x requires Python >= 3.10
  - when:
      python: "<3.10"
    skip:
      poetry: ">=2.0"
  # pnpm 11 requires Node >= 22
  - when:
      node: "<22"
    skip:
      pnpm: ">=11"
